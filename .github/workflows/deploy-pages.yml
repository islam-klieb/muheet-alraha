name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir dist
          cp index.html privacy-policy.html 404.html robots.txt sitemap.xml site.webmanifest dist/
          cp -R css images js dist/
          python - <<'PY'
          import os
          from pathlib import Path

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/")
          base_path = os.environ["PAGES_BASE_PATH"].rstrip("/")
          pages_host = base_url.removeprefix("https://")
          for name in ("index.html", "privacy-policy.html", "robots.txt", "sitemap.xml"):
              path = Path("dist") / name
              content = path.read_text(encoding="utf-8")
              path.write_text(content.replace("YOUR-DOMAIN.com", pages_host), encoding="utf-8")

          for name in ("404.html", "privacy-policy.html", "site.webmanifest"):
              path = Path("dist") / name
              content = path.read_text(encoding="utf-8")
              path.write_text(content.replace("__PAGES_BASE_PATH__", base_path), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
